services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devdocs-pgvector
    environment:
      POSTGRES_USER: devdocs
      POSTGRES_PASSWORD: devdocs
      POSTGRES_DB: devdocs
    ports:
      - "5433:5432"
    volumes:
      - devdocs_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdocs -d devdocs"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devdocs_pgvector_data: